name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]   # oldest and newest the team uses
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch is much smaller than the default CUDA build
          pip install torch --index-url https://download.pytorch.org/whl/cpu || pip install torch
          pip install -e '.[dev]'
      - name: Lint (only real errors block; style does not)
        run: ruff check . --select E9,F63,F7,F82
      - name: Tests (includes the leakage guard)
        run: pytest -q
      - name: Smoke run (end-to-end on the tiny config)
        run: make smoke
