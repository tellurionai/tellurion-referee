name: Demo

# Tests the web demo on every PR that touches it, and publishes it to GitHub Pages on
# every merge to main (T37). Pages must be set to "GitHub Actions" under Settings > Pages.
on:
  pull_request:
    paths: ["demo/**", ".github/workflows/demo.yml"]
  push:
    branches: [main]
    paths: ["demo/**", ".github/workflows/demo.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: demo/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: demo/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
